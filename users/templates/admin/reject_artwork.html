{% extends "admin/admin_base.html" %}
{% load static %}
{% block content %}
<h1>Отклонить артворк: {{ art.title }}</h1>
<form method="post">{% csrf_token %}
  <label for="reason">Причина отклонения:</label><br>
  <textarea name="reason" id="reason" rows="4" cols="60" required>{{ art.rejection_reason }}</textarea><br>
  <button type="submit">Отклонить</button>
  <a href="{% url 'users_admin:review_artworks' %}">Отмена</a>
</form>
{% endblock %}
