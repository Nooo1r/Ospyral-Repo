<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добро пожаловать на нашу платформу</title>
    <style>
        /* Стили для оформления страницы */
        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #fff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            border-radius: 8px;
        }

        .container h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .container p {
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        .btn {
            text-decoration: none;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            margin: 5px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Добро пожаловать на нашу платформу!</h1>
        <p>Откройте для себя уникальные возможности продажи и покупки эксклюзивной информации.</p>
        <a href="{% url 'register' %}" class="btn">Зарегистрироваться</a>
        <a href="{% url 'login' %}" class="btn">Войти</a>
    </div>
</body>
</html>
