{% extends 'base.html' %}

{% block content %}

<p>Вы действительно хотите удалить этот продукт?</p>

<form method="POST">
    {% csrf_token %}

    <a href="{% url 'seller_products' %}">Отмена</a>
</form>

{% endblock %}
