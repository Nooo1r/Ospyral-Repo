<form
  hx-post="{% url 'toggle_sale_artwork' artwork.id %}"
  hx-target="this"
  hx-swap="outerHTML"
  method="post"
  class="inline"
>
  {% csrf_token %}

  {% if artwork.is_active %}
    <button type="submit" class="btn btn-warning">Остановить продажу</button>
  {% else %}
    <button type="submit" class="btn btn-success">Возобновить продажу</button>
  {% endif %}
</form>
