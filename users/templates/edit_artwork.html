{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать изображение</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>
    <header class="header">
        <div class="header-logo">
            <img src="{% static 'images/logo.svg' %}" alt="Логотип" class="logo">
        </div>
        <div class="header-actions">
            <span class="user-name">{{ user.username }}</span>
            <a href="{% url 'logout' %}" class="btn btn-logout">Выйти</a>
        </div>
    </header>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="menu-container">
                <div class="menu-icon">
                    <img src="{% static 'images/menu-icon.svg' %}" alt="Меню" class="menu-icon-img">
                </div>
                <nav class="menu-items">
                    <h2>Меню</h2>
                    <a href="{% url 'dashboard' %}" class="sidebar-link">Главная</a>
                </nav>
            </div>
        </aside>
        <main class="content">
            <h1>Редактировать {{ artwork.title }}</h1>
            <form method="post" enctype="multipart/form-data" class="add-product-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-save">Сохранить</button>
                <a href="{% url 'dashboard' %}" class="btn btn-cancel">Отмена</a>
            </form>
        </main>
    </div>
</body>
</html>
