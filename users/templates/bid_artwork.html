{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сделать ставку</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>
    <div class="content">
        <h1>Сделать ставку на {{ artwork.title }}</h1>
        <p>Текущая ставка: {{ artwork.current_bid|default:'Нет ставок' }} ₽</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="bid">Ваша ставка (₽):</label>
                <input type="number" name="bid" id="bid" step="0.01" required>
            </div>
            <button type="submit" class="btn btn-bid">Сделать ставку</button>
            <a href="{% url 'dashboard' %}" class="btn btn-cancel">Отмена</a>
        </form>
    </div>
</body>
</html>
