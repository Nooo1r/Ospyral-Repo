{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оценка продукта: {{ product.title }}</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>
    <header class="header">
        <div class="header-logo">
            <img src="{% static 'images/logo.svg' %}" alt="Логотип" class="logo">
        </div>
        <div class="header-actions">
            <span class="user-name">{{ user.username }}</span>
            <a href="{% url 'logout' %}" class="btn btn-logout">Выйти</a>
        </div>
    </header>
    <div class="dashboard">
        <main class="content">
            <h1>Оцените продукт: {{ product.title }}</h1>
            <form method="post">
                {% csrf_token %}
                <label for="rating">Оценка (от 1 до 5):</label>
                <input type="number" id="rating" name="rating" min="1" max="5" required>
                <button type="submit" class="btn">Отправить оценку</button>
            </form>
        </main>
    </div>
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
</body>
</html>
